name: Publish validated Krysta 1.0.27
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krysta-publish-validated-1-0-27.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified candidate publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run krysta-release-1-0-27.yml --repo "$GITHUB_REPOSITORY" --ref main -f validated_run=45487864355
