name: Promote Krysta 1.0.26
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krysta-promote-1-0-26.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Promote existing release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.26 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'krysta-launcher-1.0.26-setup.exe'
          cat > /tmp/krysta-notes.md <<'EOF'
          ## Krysta Engine 1.0.26 – Security Shield i Game Boost 3.0

          Wydanie łączy zmiany wersji 1.0.25 i 1.0.26. Zachowano dotychczasowy wygląd programu.

          ### Bezpieczeństwo
          - Mechanizm skanowania pobranych plików i inwentaryzacji plików wykonywalnych.
          - Obliczanie SHA-256, sprawdzanie podpisów cyfrowych i wydawców.
          - Opcjonalne sprawdzanie reputacji skrótów w VirusTotal (wymaga konfiguracji klucza API).
          - Klasyfikacja podejrzanych wyników, ponowna weryfikacja i polskie uzasadnienia.
          - Historia decyzji bezpieczeństwa i kolejka skanowania.

          ### Wydajność i Game Boost 3.0
          - Usprawnienia ładowania biblioteki, pamięci podręcznej i operacji dyskowych.
          - Ograniczanie wybranych zadań w tle podczas gry i renderowania launchera.
          - Ochrona ważnych procesów oraz usprawnione przywracanie aplikacji po grze.
          - Usprawnienia obsługi FPS, nakładki nagrywania i kolejki kompresji zrzutów.
          - Strumieniowe przesyłanie archiwów w mechanizmie synchronizacji Hydra.
          - Ograniczenie częstotliwości aktualizacji postępu pobierania.
          - Opcjonalna diagnostyka zużycia pamięci i CPU.

          ### Weryfikacja i ograniczenia
          Testy regresji Windows, kontrola TypeScript i kompilacja zakończyły się powodzeniem. Rzeczywiste oszczędności RAM, CPU i GPU nie zostały jeszcze zmierzone. Security Shield nie potwierdza obecnie jednoznacznie czystego wyniku konkretnego skanowania; brak wykrycia nie gwarantuje bezpieczeństwa. Nie zastępuje programu antywirusowego.

          ### Pobieranie
          - Setup.exe – instalator Windows.
          - Portable.exe – wersja bez instalacji.
          - SHA-256 – sumy kontrolne plików.
          EOF
          gh release edit v1.0.26 --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title 'Krysta Engine 1.0.26 – Security Shield i Game Boost 3.0' --notes-file /tmp/krysta-notes.md
          gh release view v1.0.26 --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,url
