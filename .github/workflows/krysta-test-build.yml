name: Krysta Test Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Test Krysta settings recovery
        run: node --import ./scripts/register-ts-node.mjs --test src/main/services/krysta-settings-recovery.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare offline translation runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'krysta-translate'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile "$env:RUNNER_TEMP/python-embed.zip"
          Expand-Archive "$env:RUNNER_TEMP/python-embed.zip" $runtime -Force
          Add-Content (Join-Path $runtime 'python311._pth') 'Lib/site-packages'
          python -m pip install --only-binary=:all: --target "$runtime/Lib/site-packages" 'argostranslate==1.11.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/krysta-translate.py $runtime
          '{"title":"Game update","content":"Fixed a crash."}' | & "$runtime/python.exe" -I "$runtime/krysta-translate.py" "$env:RUNNER_TEMP/krysta-model-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Hydra base package version
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Hydra base package version' }
          "MAIN_VITE_KRYSTA_HYDRA_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows without publishing
        run: yarn build:win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_ID: ${{ vars.KRYSTA_GOOGLE_CLIENT_ID }}
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_SECRET: ${{ secrets.KRYSTA_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://auth.hydra.losbroxas.org' }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL || 'https://checkout.hydralauncher.gg' }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL || 'https://api.hydranimbus.com' }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Krysta-test-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
