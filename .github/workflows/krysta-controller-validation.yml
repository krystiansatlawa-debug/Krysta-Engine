name: Krysta Controller Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/krysta-controller-validation.yml"
      - "src/big-picture/**"
      - "src/controller-settings/**"
      - "src/main/events/**/*controller*"
      - "src/main/services/*controller*"
      - "src/main/services/window-manager.ts"
      - "src/shared/controller-*.ts"
      - "native/hydra-native/**"
permissions:
  contents: read
concurrency:
  group: krysta-controller-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and compile the native addon
        run: yarn --frozen-lockfile
      - name: Type-check both launchers and the native bridge
        run: yarn typecheck
      - name: Test controller and game lifecycle behavior
        run: >
          node --import ./scripts/register-ts-node.mjs --test
          "src/shared/controller-*.test.ts"
          "src/main/services/*controller*.test.ts"
          src/main/services/game-running-state.test.ts
          src/main/services/xbox-guide-window-toggle.test.ts
          scripts/krysta-recording.test.mjs
