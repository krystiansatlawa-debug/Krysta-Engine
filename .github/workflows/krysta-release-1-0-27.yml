name: Krysta 1.0.27 Windows Release

on:
  push:
    branches: [krysta-1.0.27]
  workflow_dispatch:
    inputs:
      validated_run:
        description: "Successful candidate run ID to publish. Leave blank to build a candidate."
        required: false
        type: string

permissions:
  contents: read

env:
  KRYSTA_VERSION: "1.0.27"
  KRYSTA_ARTIFACT: Krysta-1.0.27-windows
  KRYSTA_NOTES: docs/krysta-1.0.27-release-notes.md

jobs:
  windows:
    if: github.event_name == 'push' || inputs.validated_run == ''
    runs-on: windows-2022
    timeout-minutes: 90
    concurrency:
      group: krysta-1.0.27-candidate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          cache-bin: false
      - name: Install dependencies and compile the native addon
        run: yarn --frozen-lockfile
      - name: Type-check the launchers and native bridge
        run: yarn typecheck
      - name: Run Windows automated regressions
        run: >
          node --import ./scripts/register-ts-node.mjs --test
          "src/controller-settings/**/*.test.ts"
          "src/main/events/*controller*.test.ts"
          "src/main/services/*controller*.test.ts"
          "src/shared/controller-*.test.ts"
          src/main/services/game-running-state.test.ts
          src/main/services/windows-game-window-match.test.ts
          src/main/services/xbox-guide-window-toggle.test.ts
          src/main/services/presentmon-fps.test.ts
          src/main/events/krysta-fps.test.ts
          src/main/events/krysta-updates-during-game.test.ts
          scripts/krysta-recording.test.mjs
          src/shared/screenshot-input.test.ts
          src/main/services/krysta-settings-recovery.test.ts
          src/main/services/achievements/ubisoft-recording-baseline.test.ts
          src/main/services/achievements/rockstar-achievement-data.test.ts
          src/main/services/achievements/rockstar-achievement-client.test.ts
          src/main/services/achievements/ubisoft-achievement-presentation.test.ts
          src/main/events/user/get-unlocked-achievements-ubisoft.test.ts
          src/main/services/steam-integration/steam-community-achievements.test.ts
          src/main/services/steam-integration/steam-game-exit-sync.test.ts
          src/main/services/krysta-google-oauth.test.ts
          src/main/services/krysta-local-media-and-executable.test.ts
          src/main/helpers/krysta-executable-ranking.test.ts
          src/main/helpers/krysta-executable-autolink.test.ts
          src/shared/game-update-patch-history.test.ts
          src/main/services/game-boost-applications.test.ts
          src/main/services/game-boost-background-sync.test.ts
          src/shared/game-boost-preferences.test.ts
          src/main/services/game-journal-store.test.ts
          src/main/services/story-progress-save.test.ts
          src/main/services/story-progress-metadata.test.ts
          src/renderer/src/pages/game-details/story-progress-card-registry.test.ts
          src/renderer/src/pages/game-details/story-achievement-milestones.test.ts
          src/renderer/src/context/game-details/game-details.context.test.ts
          src/renderer/src/pages/library/library-hidden-games.test.ts
          src/renderer/src/pages/catalogue/catalogue-extras-data.test.ts
          src/main/services/automatic-story-progress.test.ts
          src/main/services/epic/sync-runtime.test.ts
          src/main/services/library-sync/epic-hydra-writes.test.ts
          src/main/services/cloud-save/cloud-save-game-context.test.ts
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
      - name: Prepare verified PresentMon
        run: node scripts/prepare-presentmon.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare and test the offline translation runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'krysta-translate'
          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $archive
          Expand-Archive $archive $runtime -Force
          Add-Content (Join-Path $runtime 'python311._pth') 'Lib/site-packages'
          python -m pip install --only-binary=:all: --target "$runtime/Lib/site-packages" 'argostranslate==1.11.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/krysta-translate.py $runtime
          '{"title":"Game update","content":"Fixed a crash."}' | & "$runtime/python.exe" -I -X utf8 "$runtime/krysta-translate.py" "$env:RUNNER_TEMP/krysta-model-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set the package version while preserving the Hydra base
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Hydra base package version' }
          "MAIN_VITE_KRYSTA_HYDRA_BASE=$base" >> $env:GITHUB_ENV
          npm version $env:KRYSTA_VERSION --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows installer and portable executable
        run: yarn build:win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_ID: ${{ vars.KRYSTA_GOOGLE_CLIENT_ID }}
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_SECRET: ${{ secrets.KRYSTA_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://auth.hydra.losbroxas.org' }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL || 'https://checkout.hydralauncher.gg' }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL || 'https://api.hydranimbus.com' }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
      - name: Verify the packaged addon and both executable artifacts
        run: node scripts/validate-krysta-windows-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KRYSTA_ARTIFACT }}
          path: |
            dist/krysta-launcher-${{ env.KRYSTA_VERSION }}-setup.exe
            dist/krysta-launcher-${{ env.KRYSTA_VERSION }}-portable.exe
            dist/krysta-launcher-${{ env.KRYSTA_VERSION }}-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.validated_run != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: krysta-1.0.27-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the successful Windows candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.validated_run }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid candidate run ID" >&2; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
          jq -e '
            .path == ".github/workflows/krysta-release-1-0-27.yml" and
            .conclusion == "success" and
            (.head_branch == "krysta-1.0.27" or .head_branch == "main")
          ' <<< "$run" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs" | jq -e '
            any(.jobs[]; .name == "windows" and .conclusion == "success")
          ' >/dev/null
          sha=$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' <<< "$run")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          git show "$sha:$KRYSTA_NOTES" > "$RUNNER_TEMP/krysta-release-notes.md"
          test -s "$RUNNER_TEMP/krysta-release-notes.md"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.KRYSTA_ARTIFACT }}
          path: release-files
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
      - name: Check the downloaded release files
        shell: bash
        working-directory: release-files
        run: |
          stem="krysta-launcher-$KRYSTA_VERSION"
          test -s "$stem-setup.exe"
          test -s "$stem-portable.exe"
          diff -u <(sha256sum "$stem-setup.exe" "$stem-portable.exe") "$stem-sha256.txt"
      - name: Publish the verified stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          tag="v$KRYSTA_VERSION"
          stem="krysta-launcher-$KRYSTA_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA"
          fi
          gh release create "$tag" \
            "release-files/$stem-setup.exe" "release-files/$stem-portable.exe" "release-files/$stem-sha256.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --latest \
            --title "Krysta Launcher $KRYSTA_VERSION – Kontrolery, pulpit i ekrany" \
            --notes-file "$RUNNER_TEMP/krysta-release-notes.md"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          jq -e \
            --arg setup "$stem-setup.exe" --arg portable "$stem-portable.exe" --arg checksums "$stem-sha256.txt" '
              (.draft == false and .prerelease == false) and
              (([.assets[].name] | sort) == ([$setup, $portable, $checksums] | sort))
            ' <<< "$release"
          for file in "$stem-setup.exe" "$stem-portable.exe" "$stem-sha256.txt"; do
            hash=$(sha256sum "release-files/$file" | cut -d ' ' -f 1)
            jq -e --arg file "$file" --arg digest "sha256:$hash" '
              any(.assets[]; .name == $file and .state == "uploaded" and .digest == $digest)
            ' <<< "$release" >/dev/null
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')" = "$RELEASE_SHA"
