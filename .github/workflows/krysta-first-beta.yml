name: Krysta Release
# Retry 1.0.35 after correcting unused scan settings; retain all regression and type checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/krysta-first-beta.yml"

permissions:
  contents: write

concurrency:
  group: krysta-release-1-0-35
  cancel-in-progress: true

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Run Windows release regressions
        run: >
          node --import ./scripts/register-ts-node.mjs --test
          src/renderer/src/helpers/response-cache.test.ts
          src/main/services/krysta-settings-recovery.test.ts
          src/main/services/achievements/ubisoft-recording-baseline.test.ts
          src/main/services/achievements/rockstar-achievement-data.test.ts
          src/main/services/achievements/rockstar-achievement-client.test.ts
          src/main/services/achievements/ubisoft-achievement-presentation.test.ts
          src/main/events/user/get-unlocked-achievements-ubisoft.test.ts
          src/main/services/steam-integration/steam-community-achievements.test.ts
          src/main/services/steam-integration/steam-game-exit-sync.test.ts
          src/main/services/krysta-google-oauth.test.ts
          src/main/services/krysta-local-media-and-executable.test.ts
          src/main/helpers/krysta-executable-ranking.test.ts
          src/main/helpers/krysta-executable-autolink.test.ts
          src/shared/game-update-patch-history.test.ts
          scripts/krysta-recording.test.mjs
          src/main/services/windows-game-window-match.test.ts
          src/main/services/xbox-guide-window-toggle.test.ts
          src/main/services/presentmon-fps.test.ts
          src/main/events/krysta-fps.test.ts
          src/main/events/krysta-updates-during-game.test.ts
          src/main/services/game-running-state.test.ts
          src/main/services/game-boost-applications.test.ts
          src/main/services/game-boost-background-sync.test.ts
          src/shared/game-boost-preferences.test.ts
          src/shared/controller-shortcut-recorder.test.ts
          src/shared/screenshot-input.test.ts
          src/main/services/game-journal-store.test.ts
          src/main/services/story-progress-save.test.ts
          src/main/services/story-progress-metadata.test.ts
          src/renderer/src/pages/game-details/story-progress-card-registry.test.ts
          src/renderer/src/pages/game-details/story-achievement-milestones.test.ts
          src/renderer/src/context/game-details/game-details.context.test.ts
          src/renderer/src/pages/library/library-hidden-games.test.ts
          src/renderer/src/pages/catalogue/catalogue-extras-data.test.ts
          src/main/services/automatic-story-progress.test.ts
          src/main/services/epic/sync-runtime.test.ts
          src/main/services/library-sync/epic-hydra-writes.test.ts
          src/main/services/cloud-save/cloud-save-game-context.test.ts
      - name: Type-check Krysta 1.0.35 Windows release
        run: yarn typecheck
      - name: Prepare verified PresentMon
        run: node scripts/prepare-presentmon.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare offline translation runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'krysta-translate'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile "$env:RUNNER_TEMP/python-embed.zip"
          Expand-Archive "$env:RUNNER_TEMP/python-embed.zip" $runtime -Force
          Add-Content (Join-Path $runtime 'python311._pth') 'Lib/site-packages'
          python -m pip install --only-binary=:all: --target "$runtime/Lib/site-packages" 'argostranslate==1.11.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/krysta-translate.py $runtime
          '{"title":"Game update","content":"Fixed a crash."}' | & "$runtime/python.exe" -I -X utf8 "$runtime/krysta-translate.py" "$env:RUNNER_TEMP/krysta-model-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Hydra base package version
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Hydra base package version' }
          "MAIN_VITE_KRYSTA_HYDRA_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set Krysta 1.0.35 version
        run: npm version 1.0.35 --no-git-tag-version --ignore-scripts
      - name: Check optional desktop Google OAuth configuration
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.KRYSTA_GOOGLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.KRYSTA_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_ID) -or (-not $env:GOOGLE_DESKTOP_CLIENT_ID.EndsWith('.apps.googleusercontent.com')) -or [string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_SECRET)) { Write-Warning 'Bundled desktop Google OAuth configuration is missing; Google Drive requires manual Desktop client JSON import.' }
      - name: Build Windows without publishing
        run: yarn build:win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_ID: ${{ vars.KRYSTA_GOOGLE_CLIENT_ID }}
          MAIN_VITE_KRYSTA_GOOGLE_CLIENT_SECRET: ${{ secrets.KRYSTA_GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://auth.hydra.losbroxas.org' }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL || 'https://checkout.hydralauncher.gg' }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL || 'https://api.hydranimbus.com' }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
      - name: Keep build files for one day
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Krysta-1.0.35-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

      # Publish only after the regression tests and both Windows packages succeed.
      - name: Publish Krysta 1.0.35 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.35'
          $files = @('dist/krysta-launcher-1.0.35-setup.exe', 'dist/krysta-launcher-1.0.35-portable.exe')
          foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release installer: $file" } }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite' }
          $hashes = $files | ForEach-Object { $h = Get-FileHash -LiteralPath $_ -Algorithm SHA256; "$($h.Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)" }
          $hashes | Set-Content -LiteralPath 'dist/krysta-launcher-1.0.35-sha256.txt' -Encoding ascii
          $files += 'dist/krysta-launcher-1.0.35-sha256.txt'
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Krysta Launcher 1.0.35 - Powiadomienia i filtry biblioteki' --latest --notes 'Ograniczono spam starymi patchami: cicha pierwsza synchronizacja, limit wieku 7 dni i wygaszanie starych oznaczen. Otwarcie listy patchy automatycznie usuwa oznaczenie w bibliotece. Dodano filtry Niezainstalowane i Gry bez kategorii. Ograniczono automatyczne sprawdzanie wersji plikow EXE i odpytywanie dostawcow, wstrzymano skanowanie podczas gry. Steam nadal jest odpytywany okresowo; nie jest to system push.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
