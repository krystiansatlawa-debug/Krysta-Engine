<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"/>
  <style>
    html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif}
    #notice{margin:8px;background:rgba(18,20,26,.94);border:1px solid rgba(255,255,255,.2);border-radius:11px;
      box-shadow:0 8px 25px #0009;display:flex;align-items:center;gap:12px;padding:14px;color:#fff;min-height:48px}
    .dot{width:14px;height:14px;border-radius:100%;background:#ff4545;flex:none;box-shadow:0 0 0 4px #ff45452e}
    .saved .dot{background:#4ad69a;box-shadow:0 0 0 4px #4ad69a2e}
    .failed .dot{background:#ffb454;box-shadow:0 0 0 4px #ffb4542e}
    strong{font-size:15px;display:block} small{display:block;color:#d5d5dc;font-size:12px;margin-top:3px}
    @media (prefers-reduced-motion: no-preference) {
      #notice { animation: notice-enter 180ms ease-out both; }
      @keyframes notice-enter {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div id="notice" role="status" aria-live="polite">
    <span class="dot"></span><div><strong id="title"></strong><small id="subtitle"></small></div>
  </div>
  <script>
    const status = new URLSearchParams(location.search).get("state");
    const messages = {
      started: ["Nagrywanie rozpoczęte", "F9 — zakończ i zapisz"],
      saved: ["Nagranie zapisane", "Film znajdziesz w zakładce Nagrania"],
      failed: ["Nie udało się nagrać", "Sprawdź zakładkę Nagrania i błąd nagrywania"]
    };
    const kind = Object.hasOwn(messages, status) ? status : "failed";
    document.getElementById("notice").classList.add(kind);
    document.getElementById("title").textContent = messages[kind][0];
    document.getElementById("subtitle").textContent = messages[kind][1];
  </script>
</body>
</html>
