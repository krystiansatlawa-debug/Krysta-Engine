<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Krysta capture worker</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; media-src blob:"
    />
  </head>
  <body>
    <script>
      "use strict";
      let config,
        stream,
        video,
        rotation = null,
        rotating = null,
        buffered = null,
        started = false,
        ended = false,
        saving = false,
        selected = null,
        starting = null,
        finishTimer = null;
      let chosenMime = "";
      let nvidiaEncoder = null;
      let captureFps = 60;
      let adaptationTimer = null;
      let adaptationBusy = false;
      let pressureSamples = 0;
      let healthySamples = 0;
      let lastAdaptationTick = 0;

      // Timer delay is a conservative worker-pressure signal, not a GPU meter.
      // Change capture cadence without restarting the encoder or changing resolution.
      function startAdaptation() {
        captureFps = config.fps;
        if (captureFps <= 30) return;
        lastAdaptationTick = performance.now();
        adaptationTimer = setInterval(async () => {
          const now = performance.now();
          const delayed = now - lastAdaptationTick > 1250;
          lastAdaptationTick = now;
          if (ended || adaptationBusy) return;
          pressureSamples = delayed ? pressureSamples + 1 : 0;
          healthySamples = delayed ? 0 : healthySamples + 1;
          const next = pressureSamples >= 3 ? 30 : healthySamples >= 15 ? config.fps : captureFps;
          if (next === captureFps) return;
          const track = stream?.getVideoTracks()[0];
          if (!track || track.readyState !== "live") return;
          adaptationBusy = true;
          try {
            await track.applyConstraints({ ...track.getConstraints(), frameRate: { ideal: next, max: next } });
            captureFps = next;
          } catch {
            // Unsupported capture constraints must never interrupt recording.
          } finally {
            pressureSamples = 0;
            healthySamples = 0;
            adaptationBusy = false;
          }
        }, 1000);
      }

      function videoBitrate() {
        return Math.round(
          ({ 720: 3000000, 1080: 5000000, 1440: 7000000 }[config.quality] ||
            5000000) * (captureFps === 60 ? 1.3 : 1)
        );
      }
      function chooseMime() {
        const audioCodec = config.audio ? ",opus" : "";
        return (
          [
            "video/webm;codecs=vp8" + audioCodec,
            "video/webm;codecs=vp9" + audioCodec,
            "video/webm",
          ].find((type) => MediaRecorder.isTypeSupported(type)) || ""
        );
      }
      async function chooseNvidiaEncoder() {
        const muxer = globalThis.krystaRecordingMuxer;
        if (!config.preferNvidia || !muxer) return null;
        const videoTrack = stream.getVideoTracks()[0];
        const audioTrack = stream.getAudioTracks()[0];
        const { width, height } = videoTrack.getSettings();
        if (!width || !height) return null;
        const videoConfig = {
          bitrate: videoBitrate(),
          hardwareAcceleration: "prefer-hardware",
          latencyMode: "realtime",
          bitrateMode: "variable",
        };
        // Electron's Chromium backend treats prefer-hardware as a hard
        // requirement. It does not substitute a software video encoder.
        if (
          !(await muxer.canEncodeVideo("avc", {
            ...videoConfig,
            width,
            height,
            frameRate: config.fps,
          }))
        )
          return null;

        const audioConfig = { codec: "aac", bitrate: 128000 };
        if (audioTrack) {
          const { channelCount, sampleRate } = audioTrack.getSettings();
          const audioOptions = {
            bitrate: audioConfig.bitrate,
            numberOfChannels: channelCount ?? 2,
            sampleRate: sampleRate ?? 48000,
          };
          if (!(await muxer.canEncodeAudio("aac", audioOptions))) return null;
        }
        return { muxer, videoTrack, audioTrack, videoConfig, audioConfig };
      }
      function stopSegment(s) {
        if (!s?.recording()) return;
        try {
          s.stop();
        } catch {}
      }
      function webmSegment() {
        if (!chosenMime) throw Error("WebM recording not supported");
        const recorder = new MediaRecorder(stream, {
          mimeType: chosenMime,
          videoBitsPerSecond: videoBitrate(),
          audioBitsPerSecond: 128000,
        });
        const s = {
          recording: () => recorder.state === "recording",
          stop: () => recorder.stop(),
          format: "webm",
          start: performance.now(),
          chunks: [],
          size: 0,
          discard: false,
          error: null,
          done: null,
        };
        s.done = new Promise((resolve) => {
          recorder.ondataavailable = (e) => {
            if (s.discard || !e.data.size) return;
            s.size += e.data.size;
            if (s.size > config.maxBytes) {
              s.error = Error("Recording size limit reached");
              s.chunks = [];
              stopSegment(s);
              return;
            }
            s.chunks.push(e.data);
          };
          recorder.onerror = (e) => {
            s.error = e.error || Error("Recording failed");
            stopSegment(s);
          };
          recorder.onstop = () =>
            resolve(Math.max(0, (performance.now() - s.start) / 1000));
        });
        // Batch chunks to reduce renderer wakeups during gameplay.
        recorder.start(2000);
        return s;
      }
      async function nvidiaSegment(encoder) {
        const { muxer, videoTrack, audioTrack, videoConfig, audioConfig } =
          encoder;
        const target = new muxer.BufferTarget();
        const output = new muxer.Output({
          format: new muxer.Mp4OutputFormat(),
          target,
        });
        const finishSignal = Promise.withResolvers();
        const ready = Promise.withResolvers();
        let isRecording = true;
        let hasVideo = false;
        let hasAudio = !audioTrack;
        const s = {
          recording: () => isRecording,
          stop: () => {
            isRecording = false;
            finishSignal.resolve();
          },
          format: "mp4",
          start: performance.now(),
          chunks: [],
          size: 0,
          discard: false,
          error: null,
          done: null,
        };
        function fail(error) {
          s.error ||= error;
          ready.reject(error);
          stopSegment(s);
        }
        function packetWritten(packet) {
          s.size += packet.byteLength;
          if (s.size > config.maxBytes)
            fail(Error("Recording size limit reached"));
          else if (hasAudio && hasVideo) ready.resolve();
        }
        const video = new muxer.MediaStreamVideoTrackSource(
          videoTrack,
          {
            ...videoConfig,
            bitrate: videoBitrate(),
            codec: "avc",
            sizeChangeBehavior: "contain",
            onEncodedPacket(packet) {
              hasVideo = true;
              packetWritten(packet);
            },
          },
          { frameRate: null }
        );
        const sourceErrors = [video.errorPromise];
        output.addVideoTrack(video);
        if (audioTrack) {
          const audio = new muxer.MediaStreamAudioTrackSource(audioTrack, {
            ...audioConfig,
            onEncodedPacket(packet) {
              hasAudio = true;
              packetWritten(packet);
            },
          });
          sourceErrors.push(audio.errorPromise);
          output.addAudioTrack(audio);
        }
        void Promise.race(sourceErrors).catch((error) => {
          nvidiaEncoder = null;
          fail(error);
        });

        s.done = finishSignal.promise.then(async () => {
          const duration = Math.max(0, (performance.now() - s.start) / 1000);
          try {
            if (s.discard || s.error) await output.cancel();
            else {
              await output.finalize();
              if (!target.buffer || target.buffer.byteLength > config.maxBytes)
                throw Error("Recording size limit reached");
              s.chunks = [target.buffer];
            }
          } catch (error) {
            s.error ||= error;
          }
          return duration;
        });

        let deadline;
        starting = s;
        try {
          await Promise.race([
            Promise.all([output.start(), ready.promise]),
            finishSignal.promise.then(() => {
              throw s.error || Error("Capture cancelled");
            }),
            new Promise((_, reject) => {
              deadline = setTimeout(
                () => reject(Error("NVIDIA encoder startup timed out")),
                2500
              );
            }),
          ]);
          return s;
        } catch (error) {
          fail(error);
          await s.done;
          throw error;
        } finally {
          starting = null;
          clearTimeout(deadline);
        }
      }
      async function segment() {
        if (!stream?.active || ended) throw Error("Capture stream ended");
        if (nvidiaEncoder) {
          try {
            return await nvidiaSegment(nvidiaEncoder);
          } catch {
            nvidiaEncoder = null;
            if (!stream?.active || ended) throw Error("Capture stream ended");
          }
        }
        return webmSegment();
      }
      function discard(s) {
        s.discard = true;
        s.chunks = [];
        stopSegment(s);
        return s.done;
      }
      function stopRotation() {
        if (rotation) clearTimeout(rotation);
        rotation = null;
      }
      function rotate() {
        rotation = null;
        const previous = buffered;
        buffered = null;
        if (!previous) return;
        // Wait for the recorder to finish releasing its encoder before starting another.
        rotating = discard(previous).then(() => {
          rotating = null;
          startRotation();
        });
      }
      function startRotation() {
        if (ended || saving || config.preSeconds === 0) return;
        rotating = segment()
          .then(async (next) => {
            if (ended || saving) {
              await discard(next);
              return;
            }
            buffered = next;
            rotation = setTimeout(rotate, config.preSeconds * 1000);
          })
          .catch(() => globalThis.krystaStop())
          .finally(() => {
            rotating = null;
          });
        return rotating;
      }
      function stopPreview() {
        if (!video) return;
        video.pause();
        video.srcObject = null;
        video = null;
      }
      function captureThumbnail(onFrame) {
        const preview = document.createElement("video");
        video = preview;
        preview.muted = true;
        preview.addEventListener(
          "loadeddata",
          () => {
            if (video !== preview) return;
            onFrame(thumb());
            stopPreview();
          },
          { once: true }
        );
        preview.srcObject = stream;
        void preview.play().catch(() => {});
      }
      function thumb() {
        if (!video || !video.videoWidth) return undefined;
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 240;
          canvas.height = Math.max(
            1,
            Math.round((240 * video.videoHeight) / video.videoWidth)
          );
          canvas
            .getContext("2d")
            .drawImage(video, 0, 0, canvas.width, canvas.height);
          const v = canvas.toDataURL("image/jpeg", 0.6);
          return v.length <= 24000 ? v : undefined;
        } catch {
          return undefined;
        }
      }
      function finish() {
        if (finishTimer) clearTimeout(finishTimer);
        finishTimer = null;
        stopSegment(selected);
      }
      globalThis.krystaStop = () => {
        ended = true;
        if (adaptationTimer !== null) clearInterval(adaptationTimer);
        adaptationTimer = null;
        stopRotation();
        if (starting) void discard(starting);
        if (buffered) {
          void discard(buffered);
          buffered = null;
        }
        finish();
        // The main process can still save this segment after the capture track ends.
        stopSegment(manual);
        stream?.getTracks().forEach((t) => t.stop());
        stopPreview();
      };
      globalThis.krystaStart = async (prefs) => {
        if (started) throw Error("Capture already started");
        config = prefs;
        captureFps = config.fps;
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: config.fps, max: config.fps },
            width: {
              ideal: Math.round((config.quality * 16) / 9),
              max: Math.round((config.quality * 16) / 9),
            },
            height: { ideal: config.quality, max: config.quality },
          },
          audio: config.audio,
        });
        if (ended) {
          stream.getTracks().forEach((t) => t.stop());
          throw Error("Capture cancelled");
        }
        if (
          !stream.getVideoTracks().length ||
          (config.audio && !stream.getAudioTracks().length)
        ) {
          globalThis.krystaStop();
          throw Error("Requested video or system audio unavailable");
        }
        stream
          .getVideoTracks()[0]
          .addEventListener("ended", () => globalThis.krystaStop(), {
            once: true,
          });
        chosenMime = chooseMime();
        nvidiaEncoder = await chooseNvidiaEncoder().catch(() => null);
        if (ended || (!chosenMime && !nvidiaEncoder)) {
          globalThis.krystaStop();
          throw Error("Video encoder unavailable");
        }
        started = true;
        startAdaptation();
        await startRotation();
        return true;
      };
      // Manual recording starts immediately and finishes only on the next hotkey.
      // Keep it separate from achievement clips and the replay buffer.
      let manual = null;
      globalThis.krystaManualStart = async () => {
        if (!started || ended || saving || manual)
          throw Error("Capture not ready");
        saving = true;
        stopRotation();
        try {
          if (rotating) await rotating;
          if (buffered) {
            await discard(buffered);
            buffered = null;
          }
          manual = await segment();
          // Start the recorder before reporting success to the caller.
          return true;
        } catch (error) {
          saving = false;
          if (!ended) startRotation();
          throw error;
        }
      };
      globalThis.krystaManualFinish = async () => {
        if (!manual) throw Error("Manual recording not active");
        const selectedManual = manual;
        manual = null;
        try {
          stopSegment(selectedManual);
          const duration = await selectedManual.done;
          if (selectedManual.error) throw selectedManual.error;
          const format = selectedManual.format;
          const blob = new Blob(selectedManual.chunks, {
            type: "video/" + format,
          });
          const data = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result).split(",")[1]);
            r.onerror = () => reject(r.error);
            r.readAsDataURL(blob);
          });
          return {
            data,
            duration,
            audio: stream.getAudioTracks().length > 0,
            before: 0,
            format,
          };
        } finally {
          saving = false;
          if (!ended) startRotation();
        }
      };
      globalThis.krystaSave = async () => {
        if (!started || ended || saving) throw Error("Capture not ready");
        saving = true;
        stopRotation();
        try {
          if (rotating) await rotating;
          const previous = buffered;
          buffered = null;
          if (
            previous?.recording() &&
            !previous.error &&
            performance.now() - previous.start <= config.preSeconds * 1000 + 500
          ) {
            selected = previous;
          } else {
            if (previous) await discard(previous);
            selected = await segment();
          }
          const before = Math.min(
            config.preSeconds,
            Math.max(0, (performance.now() - selected.start) / 1000)
          );
          let thumbnail;
          captureThumbnail((value) => {
            thumbnail = value;
          });
          const audio = stream.getAudioTracks().length > 0;
          finishTimer = setTimeout(finish, config.seconds * 1000);
          const duration = await selected.done;
          if (selected.error) throw selected.error;
          const format = selected.format;
          const blob = new Blob(selected.chunks, { type: "video/" + format });
          const data = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result).split(",")[1]);
            r.onerror = () => reject(r.error);
            r.readAsDataURL(blob);
          });
          return { data, duration, audio, thumbnail, before, format };
        } finally {
          finish();
          stopPreview();
          selected = null;
          saving = false;
          if (!ended) startRotation();
        }
      };
    </script>
  </body>
</html>
