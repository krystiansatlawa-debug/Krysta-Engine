<!doctype html>
<html><head><meta charset="utf-8"><title>Krysta capture worker</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'"></head>
<body><script>
"use strict";
let cancelled=false, recorder=null, stream=null;
globalThis.krystaStop=()=>{cancelled=true;if(recorder&&recorder.state!=="inactive")recorder.stop();else if(stream)stream.getTracks().forEach(t=>t.stop());};
globalThis.krystaRecord=async({seconds,audio,maxBytes})=>{
 let timeout, start=0, total=0;
 const chunks=[];
 try {
  stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30,max:30},width:{ideal:1920,max:1920},height:{ideal:1080,max:1080}},audio});
  if(cancelled)throw Error("Capture cancelled");
  if(!stream.getVideoTracks().length||(audio&&!stream.getAudioTracks().length))throw Error("Requested video or system audio is unavailable");
  const mimeType=["video/webm;codecs=vp8,opus","video/webm;codecs=vp9,opus","video/webm"].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mimeType)throw Error("WebM recording not supported");
  recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:5_000_000,audioBitsPerSecond:128_000});
  const duration=await new Promise((resolve,reject)=>{
   recorder.ondataavailable=e=>{
    if(!e.data.size)return;total+=e.data.size;
    if(total>maxBytes){reject(Error("Recording size limit"));globalThis.krystaStop();return;}
    chunks.push(e.data);
   };
   recorder.onerror=e=>reject(e.error||Error("Recording failed"));
   recorder.onstop=()=>resolve((performance.now()-start)/1000);
   stream.getVideoTracks()[0].addEventListener("ended",()=>globalThis.krystaStop(),{once:true});
   start=performance.now();recorder.start(500);
   timeout=setTimeout(()=>globalThis.krystaStop(),seconds*1000);
  });
  const blob=new Blob(chunks,{type:"video/webm"});
  const data=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(String(reader.result).split(",")[1]);
   reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);
  });
  return {data,duration,audio:stream.getAudioTracks().length>0};
 }finally{
  clearTimeout(timeout);
  if(recorder&&recorder.state!=="inactive")recorder.stop();
  stream?.getTracks().forEach(t=>t.stop());
 }
};
</script></body></html>
